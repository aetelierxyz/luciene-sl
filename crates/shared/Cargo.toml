[package]
name = "coloc-shared"
version = "0.1.0"
edition = "2021"
rust-version = "1.84.1"
license = "Apache-2.0"
description = "Shared types, AWS region tables and scoring for the colocation oracle"

[lib]
name = "coloc_shared"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
chrono = { version = "0.4", features = ["serde"] }
sha2 = { version = "0.10" }
