[package]
name = "coloc-publisher"
version = "0.1.0"
edition = "2021"
rust-version = "1.84.1"
license = "Apache-2.0"
description = "Publishes the colocation report to the Solana devnet oracle program"

[[bin]]
name = "publisher"
path = "src/main.rs"

[dependencies]
coloc-shared = { path = "../shared" }

anyhow = { version = "1.0" }
borsh = { version = "1.5", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
sha2 = { version = "0.10" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

solana-sdk = { workspace = true }
solana-client = { workspace = true }
