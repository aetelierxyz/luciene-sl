[package]
name = "coloc-dashboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.84.1"
license = "Apache-2.0"
description = "Local dashboard serving the on-chain colocation recommendation on a map"

[[bin]]
name = "dashboard"
path = "src/main.rs"

[dependencies]
coloc-shared = { path = "../shared" }

anyhow = { version = "1.0" }
base64 = { version = "0.22" }
borsh = { version = "1.5", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
